# 行业资讯订阅源清单
# 每个源: name（显示名）/ url（RSS地址）/ region（地区）/ category（内容类型，作为兜底分类）
#
# region 取值: cn（中国）/ kr（韩国）/ west（欧美）
# category 取值: news（行业新闻）/ hot（热点资讯）/ review（游戏评论）
#   注意：category 只是"这个信源没有命中任何关键词规则时"的兜底分类，
#   实际每篇文章的分类由脚本里的关键词规则动态判断，参见 build_industry_radar.py。
#
# ⚠️ 重要：以下 URL 是基于公开信息整理的常见候选地址，部分网站会随改版变更 RSS 路径，
# 首次使用前请逐个在浏览器打开验证（能看到 XML 内容即有效）。标了 "# 待验证" 的条目
# 尤其需要确认，韩国几个源找到的资料比较旧，改版概率较高。失效的源脚本会自动跳过
# 并打印 [WARN]，不会导致整个任务失败。

feeds:
  # ---------------- 中国 ----------------
  - name: "游戏葡萄"
    url: "http://youxiputao.com/feed"
    region: "cn"
    category: "news"

  - name: "GameLook"
    url: "http://www.gamelook.com.cn/feed"
    region: "cn"
    category: "news"

