<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>游戏分析与数据观察站</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- 1. Docsify 基础主题 -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  
  <!-- 2. Notion 极简风 Phosphor 线条图标库 (CDN) -->
  <link rel="stylesheet" type="text/css" href="//unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />

  <!-- 3. 高级极简 UI 样式 -->
  <style>
    :root {
      --theme-color: #4f46e5; /* 主色调：靛蓝 */
    }

    /* 彻底消除全站所有下划线 */
    a, a:hover, a:focus, a:active {
      text-decoration: none !important;
    }

    /* 全局 14px 紧凑字号 */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-size: 14px;
      color: #334155;
      line-height: 1.6;
    }

    .sidebar {
      border-right: 1px solid #f1f5f9;
      background-color: #fafafa;
    }

    /* 侧边栏顶部标题“游戏分析观察站”字号调大至 18px */
    .sidebar h1,
    .sidebar .app-name,
    .sidebar .app-name-link {
      font-size: 18px !important;
      font-weight: 600 !important;
      color: #0f172a !important;
      padding: 12px 10px 4px 10px !important;
      margin: 0 !important;
      text-align: left !important;
    }

    /* Notion 风格线条图标样式微调 */
    .sidebar ul li span.ph {
      font-size: 16px !important;
      margin-right: 6px !important;
      vertical-align: -2px !important;
      color: #64748b !important;
      transition: color 0.15s ease;
      display: inline-block;
    }

    /* 侧边栏菜单项：默认状态 */
    .sidebar ul li a {
      font-size: 13px !important;
      color: #64748b !important;
      border-radius: 6px !important;
      padding: 6px 10px !important;
      margin: 2px 0 !important;
      display: block;
      transition: all 0.15s ease-in-out;
      border: 1px solid transparent !important;
    }

    /* 鼠标悬停（Hover）：浅灰圆角框包围 */
    .sidebar ul li a:hover {
      color: #0f172a !important;
      background-color: #f1f5f9 !important;
      border-color: #e2e8f0 !important;
    }
    .sidebar ul li a:hover span.ph {
      color: #0f172a !important;
    }

    /* 选中/激活（Active）：浅蓝紫圆角框包围，绝无下划线 */
    .sidebar ul li.active > a {
      color: var(--theme-color) !important;
      font-weight: 600 !important;
      background-color: #eef2ff !important;
      border-color: #c7d2fe !important;
      box-shadow: none !important;
    }
    .sidebar ul li.active > a span.ph {
      color: var(--theme-color) !important;
    }

    /* 抹除 Docsify 默认生成的所有竖线、加号或下划线伪元素 */
    .sidebar ul li.active > a::after,
    .sidebar ul li a::after,
    .sidebar ul li.active > a::before,
    .sidebar ul li a::before {
      display: none !important;
      content: "" !important;
      border: none !important;
    }

    /* 搜索框圆角 */
    .sidebar .search input {
      border-radius: 8px !important;
      border: 1px solid #e2e8f0 !important;
      padding: 8px 12px !important;
      font-size: 13px !important;
      background-color: #ffffff !important;
    }

    /* 正文排版 */
    .markdown-section h1 { font-size: 1.5rem; font-weight: 700; color: #0f172a; margin-bottom: 1.2rem; }
    .markdown-section h2 { font-size: 1.2rem; font-weight: 600; color: #1e293b; border-bottom: 1px solid #f1f5f9; padding-bottom: 6px; margin-top: 1.8rem; }
    .markdown-section h3 { font-size: 1.02rem; font-weight: 600; color: #334155; margin-top: 1.2rem; }

    .markdown-section pre { border-radius: 10px !important; background-color: #0f172a !important; padding: 12px 16px !important; }
    .markdown-section table { border-collapse: separate; border-spacing: 0; border-radius: 10px; overflow: hidden; border: 1px solid #e2e8f0; font-size: 13px; }
    .markdown-section th { background-color: #f1f5f9; padding: 8px 12px; }
    .markdown-section td { border-bottom: 1px solid #f1f5f9; padding: 8px 12px; }
    .markdown-section img { border-radius: 10px; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06); }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: '🎮 游戏分析观察站',
      repo: '',
      loadSidebar: true,
      subMaxLevel: 3,
      search: {
        placeholder: '搜索分析报告...',
        noData: '未找到相关内容'
      }
    }
  </script>
  <!-- Docsify 核心与官方插件 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  
<!-- Mermaid 流程图支持（Notion 极简高级配色） -->
  <script src="//cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-mermaid@2/dist/docsify-mermaid.js"></script>
  <script>
    mermaid.initialize({
      startOnLoad: true,
      theme: 'neutral', /* 使用极简冷灰中性主题 */
      themeVariables: {
        primaryColor: '#eef2ff',         /* 节点背景：极浅靛蓝/莫兰迪冷淡蓝 */
        primaryTextColor: '#0f172a',     /* 文字颜色：高对比冷黑 */
        primaryBorderColor: '#c7d2fe',   /* 节点边框：柔和靛蓝 */
        lineColor: '#94a3b8',            /* 连接线条：高级石墨灰 */
        secondaryColor: '#f8fafc',       /* 次要卡片：浅灰 */
        tertiaryColor: '#ffffff',        /* 辅助卡片：纯白 */
        fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif'
      }
    });
  </script>
</body>
</html>
